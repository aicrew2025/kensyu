// ── Holiday / Skip dates ─────────────────────────────────
const SKIP=new Set([
  '2026-07-20',                               // 海の日
  '2026-08-11','2026-08-13','2026-08-14','2026-08-15', // 山の日・お盆
  '2026-09-21','2026-09-22','2026-09-23',     // シルバーウィーク
  '2026-10-12',                               // スポーツの日
  '2026-11-03','2026-11-23',                  // 文化の日・勤労感謝の日
  '2027-01-01','2027-01-02','2027-01-03','2027-01-11', // 年末年始・成人の日
  '2027-02-11','2027-02-23',                  // 建国記念の日・天皇誕生日
  '2027-03-21','2027-03-22',                  // 春分の日・振替休日
]);

const HOLI_LABELS={
  '2026-07-20':'海の日','2026-08-11':'山の日',
  '2026-09-21':'敬老の日','2026-09-22':'国民の休日','2026-09-23':'秋分の日',
  '2026-10-12':'スポーツの日','2026-11-03':'文化の日','2026-11-23':'勤労感謝の日',
  '2027-01-01':'元日','2027-01-11':'成人の日',
  '2027-02-11':'建国記念','2027-02-23':'天皇誕生日',
  '2027-03-21':'春分の日','2027-03-22':'振替休日',
};
const OBON_SET=new Set(['2026-08-13','2026-08-14','2026-08-15']);
const MONTHS=[[2026,7],[2026,8],[2026,9],[2026,10],[2026,11],[2026,12],[2027,1],[2027,2],[2027,3]];
const WD=['日','月','火','水','木','金','土'];

// ── Schedule generator ────────────────────────────────────
function pad(n){return String(n).padStart(2,'0')}
function ds(y,m,d){return `${y}-${pad(m)}-${pad(d)}`}

function getWeekdays(y,m,isUpper){
  const start=isUpper?1:16;
  const end=isUpper?15:new Date(y,m,0).getDate();
  const result=[];
  for(let d=start;d<=end;d++){
    const str=ds(y,m,d);
    const dow=new Date(y,m-1,d).getDay();
    if(dow===0||dow===6)continue;
    if(SKIP.has(str))continue;
    result.push({ds:str,dow,d});
  }
  return result;
}

function pickSpread(days,n){
  if(!days.length)return[];
  if(days.length<=n)return days.slice(0,n);
  // Evenly spaced selection with weekday diversity improvement
  const total=days.length;
  const step=(total-1)/(n-1);
  const indices=Array.from({length:n},(_,i)=>Math.round(i*step));
  const picked=indices.map(i=>({...days[i]}));
  // Try to diversify weekdays by swapping duplicates
  for(let iter=0;iter<n;iter++){
    const dows=picked.map(p=>p.dow);
    let improved=false;
    for(let i=0;i<n;i++){
      if(dows.filter(d=>d===dows[i]).length>1){
        const oi=indices[i];
        for(let off=1;off<=5;off++){
          for(const sign of[-1,1]){
            const ni=oi+sign*off;
            if(ni<0||ni>=total)continue;
            const cand=days[ni];
            if(picked.find(p=>p.ds===cand.ds))continue;
            if(!dows.some((d,j)=>j!==i&&d===cand.dow)){
              picked[i]=cand;indices[i]=ni;improved=true;break;
            }
          }
          if(improved)break;
        }
        if(improved)break;
      }
    }
    if(!improved)break;
  }
  return picked.sort((a,b)=>a.ds.localeCompare(b.ds));
}

function generateEvs(){
  const ai=[],sales=[],bo=[];
  for(const[y,m]of MONTHS){
    for(const isUpper of[true,false]){
      const time=isUpper?'11:00〜13:00':'14:00〜16:00';
      const days=getWeekdays(y,m,isUpper);
      if(days.length<1)continue;
      // AI動画: pick 5 evenly
      pickSpread(days,5).forEach((d,i)=>ai.push({d:d.ds,s:i+1,t:time}));
      // 職種別: shared ①②③ from first 60%, ④⑤ from remaining
      const split=Math.ceil(days.length*0.6);
      const first=days.slice(0,Math.max(split,3));
      const shared=pickSpread(first,Math.min(3,first.length));
      const shDs=new Set(shared.map(d=>d.ds));
      shared.forEach((d,i)=>{
        sales.push({d:d.ds,s:i+1,t:time});
        bo.push({d:d.ds,s:i+1,t:time});
      });
      // After last shared date, pick ④⑤ for each
      const after=days.filter(d=>d.ds>(shared[shared.length-1]?.ds||'')&&!shDs.has(d.ds));
      const fallback=days.filter(d=>!shDs.has(d.ds));
      const pool=after.length>=4?after:fallback;
      const salesSpec=pickSpread(pool,2);
      salesSpec.forEach((d,i)=>sales.push({d:d.ds,s:i+4,t:time}));
      const salDs=new Set(salesSpec.map(d=>d.ds));
      const boPool=pool.filter(d=>!salDs.has(d.ds));
      pickSpread(boPool.length>=2?boPool:pool,2).forEach((d,i)=>bo.push({d:d.ds,s:i+4,t:time}));
    }
  }
  return{ai,sales,bo};
}

// Generate all events

// Program tabs
function rTabs(){
  document.getElementById('progBar').innerHTML=
    Object.entries(P).map(([k,v])=>`
      <button class="ptab ${k===curP?'on':''}"
        style="--tc:${v.color};--bg:${v.bg}"
        onclick="sw('${k}')">
        <span class="ptab-icon">${v.icon}</span>
        <span>
          <div class="ptab-name">${v.short}</div>
          <div class="ptab-sub">${k==='ai'?'AI動画・コンテンツ制作':k==='sales'?'職種別・営業':'職種別・バックオフィス'}</div>
        </span>
      </button>`
    ).join('');
}

function sw(k){curP=k;curS=null;rTabs();rCards();rCals()}

// Session cards
function rCards(){
  const p=P[curP];
  document.getElementById('scGrid').innerHTML=
    Object.entries(p.sess).map(([n,s])=>{
      const ni=+n,c=C[ni],on=curS===ni;
      return `<div class="sc ${on?'on':''}" style="--cd:${c.d};${on?`border-color:${c.d}`:''}" onclick="togS(${ni})">
        <div class="sc-n" style="background:${c.l};color:${c.t}">${ni}</div>
        <div class="sc-info">
          <div class="stl" style="color:${c.t}">${s.title}</div>
          <div class="sgn">${s.genre}</div>
          ${s.shared?'<span class="sh-tag">★ 営業・BO共通</span>':''}
        </div>
      </div>`;
    }).join('');
}

function togS(n){curS=curS===n?null:n;rCards();rCals()}

// Calendars
function rCals(){
  const p=P[curP];
  const em={};
  for(const ev of p.evs){
    if(curS!==null&&ev.s!==curS)continue;
    (em[ev.d]=em[ev.d]||[]).push(ev);
  }
  document.getElementById('calOuter').innerHTML=
    MONTHS.map(([y,m])=>mkMonth(y,m,em,p)).join('');
}

function mkMonth(y,m,em,p){
  const fd=new Date(y,m-1,1).getDay();
  const days=new Date(y,m,0).getDate();
  let cells='';
  for(let i=0;i<fd;i++)cells+='<div class="day emp"></div>';
  for(let d=1;d<=days;d++){
    const str=ds(y,m,d),dow=new Date(y,m-1,d).getDay();
    const isH=!!HOLI_LABELS[str],isO=OBON_SET.has(str);
    const evs=em[str]||[];
    let cls='day';
    if(isH)cls+=' hol';else if(isO)cls+=' obn';
    if(dow===0)cls+=' sun';else if(dow===6)cls+=' sat';
    const note=isH?`<span class="hn">${HOLI_LABELS[str]}</span>`:isO?`<span class="on2">お盆</span>`:'';
    const chips=evs.map(ev=>{
      const c=C[ev.s],up=ev.t.startsWith('11');
      return `<div class="chip" style="background:${up?c.l:c.d};color:${up?c.t:'#fff'}"
        onclick="openM('${curP}',${ev.s},'${str}','${ev.t}')">${p.sess[ev.s].chip}</div>`;
    }).join('');
    cells+=`<div class="${cls}"><div class="dn">${d}${note}</div><div class="chips">${chips}</div></div>`;
  }
  const rem=(fd+days)%7;
  if(rem)for(let i=0;i<7-rem;i++)cells+='<div class="day emp"></div>';
  return `<div class="cc">
    <div class="cc-hd"><h3>${y}年${m}月</h3><span class="ctag">上旬5・下旬5</span></div>
    <div class="wrow">${WD.map((w,i)=>`<div class="wd ${i===0?'s':i===6?'sa':''}">${w}</div>`).join('')}</div>
    <div class="cbody">${cells}</div>
  </div>`;
}

// Modal
function openM(pk,sn,str,tm){
  const p=P[pk],s=p.sess[sn],c=C[sn];
  const[,mo,d]=str.split('-'),dow=WD[new Date(str).getDay()];
  const b=document.getElementById('mbadge');
  b.textContent=p.name;b.style.cssText=`background:${c.l};color:${c.t}`;
  document.getElementById('mttl').textContent=s.title;
  document.getElementById('mdate').textContent=`${+mo}月${+d}日（${dow}）`;
  document.getElementById('mtime').textContent=tm;
  document.getElementById('mgnr').textContent=s.genre;
  document.getElementById('mlist').innerHTML=s.topics.map(t=>`<li>${t}</li>`).join('');
  document.getElementById('snote').style.display=s.shared?'block':'none';
  document.getElementById('mwrap').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeM(){document.getElementById('mwrap').classList.remove('open');document.body.style.overflow='';}
function bgClick(e){if(e.target===document.getElementById('mwrap'))closeM();}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM();});
init();
</script>
</body>
</html>
