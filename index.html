      position: relative;

    .day-cell.saturday .day-num { color: #3182CE; }

      align-items: center;

function buildEventMap() {
  const map = {};
  for (const ev of EVENTS) {
    if (!map[ev.date]) map[ev.date] = [];
    map[ev.date].push(ev);
  }
  return map;
}

function padDate(y, m, d) {
  return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}

  const today = new Date();
  const todayStr = padDate(today.getFullYear(), today.getMonth()+1, today.getDate());

  let html = `
    <div class="calendar-header">
      <h2>2025年 ${MONTH_NAMES[month]}</h2>
      <span>— リアルタイム研修スケジュール</span>
    </div>
    <div class="calendar-grid">
  `;

  // Weekday headers
  for (let i = 0; i < 7; i++) {
    const cls = i === 0 ? 'sun' : i === 6 ? 'sat' : '';
    html += `<div class="weekday-header ${cls}">${WEEKDAYS[i]}</div>`;
  }

  // Empty cells before month starts
  for (let i = 0; i < firstDay; i++) {
    html += `<div class="day-cell empty"></div>`;
  }

  // Day cells
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = padDate(year, month, d);
    const dow = new Date(year, month - 1, d).getDay();
    const isHoliday = !!HOLIDAYS[dateStr];
    const isObon = OBON_DAYS.has(dateStr);
    const isSun = dow === 0;
    const isSat = dow === 6;
    const isToday = dateStr === todayStr;

    let cellClass = 'day-cell';
    if (isHoliday) cellClass += ' holiday';
    else if (isObon) cellClass += ' obon';
    else if (isToday) cellClass += ' today';
    if (isSun) cellClass += ' sunday';
    if (isSat) cellClass += ' saturday';

    let dayNumHtml = `<div class="day-num">${d}`;
    if (isHoliday) dayNumHtml += `<span class="holiday-label">${HOLIDAYS[dateStr]}</span>`;
    if (isObon)    dayNumHtml += `<span class="obon-label">お盆</span>`;
    dayNumHtml += `</div>`;

    const dayEvents = eventMap[dateStr] || [];
    let eventsHtml = '<div class="events">';
    for (const ev of dayEvents) {
      const prog = PROGRAMS[ev.program];
      const sess = prog.sessions[ev.session];
      const label = sess.title;
      const shortProg = ev.program === 'ai-video' ? 'AI動画' :
                        ev.program === 'common'    ? '共通' :
                        ev.program === 'sales'     ? '営業' : 'BO';
      eventsHtml += `<div class="event-chip ${prog.chipClass}"
        onclick="showModal('${ev.program}',${ev.session},'${dateStr}','${ev.time}')"
        title="${prog.name} ${sess.title}"
      >${shortProg} ${label}</div>`;
    }
    eventsHtml += '</div>';

    html += `<div class="${cellClass}">${dayNumHtml}${eventsHtml}</div>`;
  }

  // Fill remaining cells
  const totalCells = firstDay + daysInMonth;
  const remainder = totalCells % 7;
  if (remainder !== 0) {
    for (let i = 0; i < 7 - remainder; i++) {
      html += `<div class="day-cell empty"></div>`;
    }
  }

  html += `</div>`;
  container.innerHTML = html;
}

// ─── Modal ────────────────────────────────────────────────────────────────────

function showModal(programKey, sessionNum, dateStr, time) {
  const prog = PROGRAMS[programKey];
  const sess = prog.sessions[sessionNum];
  const [y, m, d] = dateStr.split('-');
  const dow = WEEKDAYS[new Date(dateStr).getDay()];
  const dateLabel = `${parseInt(m)}月${parseInt(d)}日（${dow}）`;

  document.getElementById('modalBadge').textContent = prog.name;
  document.getElementById('modalBadge').className = `modal-program-badge ${prog.badgeClass}`;
  document.getElementById('modalTitle').textContent = sess.title;
  document.getElementById('modalDate').textContent = dateLabel;
  document.getElementById('modalTime').textContent = time;
  document.getElementById('modalGenre').textContent = sess.genre;

  const topicsEl = document.getElementById('modalTopics');
  topicsEl.innerHTML = '';
  for (const topic of sess.topics) {
    const li = document.createElement('li');
    li.textContent = topic;
    topicsEl.appendChild(li);
  }

  document.getElementById('modalOverlay').classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeModal(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModalDirect();
}
function closeModalDirect() {
  document.getElementById('modalOverlay').classList.remove('active');
  document.body.style.overflow = '';
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModalDirect(); });

// ─── Init ─────────────────────────────────────────────────────────────────────

renderCalendar('cal-2025-7', 2025, 7);
renderCalendar('cal-2025-8', 2025, 8);
</script>
