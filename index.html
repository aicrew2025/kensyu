<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>リアルタイム研修 スケジュールカレンダー</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Helvetica Neue',Arial,'Hiragino Kaku Gothic ProN','Hiragino Sans',Meiryo,sans-serif;background:#eef1f6;color:#1a202c;min-height:100vh}

/* Header */
.hd{background:linear-gradient(135deg,#0d1117 0%,#161b22 60%,#1a2744 100%);color:#fff;padding:0 24px}
.hd-in{max-width:1200px;margin:0 auto;padding:18px 0;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.hd h1{font-size:1.2rem;font-weight:700}
.hd-sub{font-size:.78rem;color:#7c9cbf;margin-top:3px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:rgba(255,255,255,.85);padding:7px 16px;border-radius:20px;font-size:.78rem;font-weight:600;cursor:pointer;transition:all .2s;white-space:nowrap}
.tab:hover{background:rgba(255,255,255,.18)}
.tab.on{background:#fff;color:#0d1117;border-color:#fff}

/* Page */
.pg{max-width:1200px;margin:0 auto;padding:24px 16px 48px}
.sec{margin-bottom:24px}
.sec-ttl{font-size:.88rem;font-weight:700;color:#2d3748;border-left:3px solid #4299e1;padding-left:10px;margin-bottom:12px}

/* Session cards */
.sc-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media(max-width:860px){.sc-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:500px){.sc-grid{grid-template-columns:repeat(2,1fr)}}
.sc{background:#fff;border-radius:12px;padding:12px 14px;cursor:pointer;border:2px solid transparent;box-shadow:0 1px 4px rgba(0,0,0,.07);display:flex;align-items:flex-start;gap:10px;transition:all .2s;user-select:none}
.sc:hover{box-shadow:0 4px 14px rgba(0,0,0,.13);transform:translateY(-1px)}
.sc.on{border-color:var(--cd);box-shadow:0 4px 16px rgba(0,0,0,.15)}
.sc-n{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1rem;flex-shrink:0}
.sc-info .stl{font-size:.83rem;font-weight:700;line-height:1.3;margin-bottom:2px}
.sc-info .sgn{font-size:.68rem;color:#718096;line-height:1.3}
.sh-tag{font-size:.6rem;background:#EBF8FF;color:#2B6CB0;border-radius:3px;padding:1px 4px;font-weight:600;display:inline-block;margin-top:2px}

/* Legend */
.lgd{background:#fff;border-radius:10px;padding:12px 18px;box-shadow:0 1px 4px rgba(0,0,0,.07);display:flex;gap:24px;flex-wrap:wrap;align-items:center}
.lgd-item{display:flex;align-items:center;gap:8px;font-size:.78rem;color:#4a5568}
.lgd-sw{width:30px;height:12px;border-radius:3px}

/* Calendar */
.cal-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(max-width:760px){.cal-grid{grid-template-columns:1fr}}
.cc{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.cc-hd{background:#1a202c;color:#fff;padding:11px 16px;display:flex;align-items:center;justify-content:space-between}
.cc-hd h3{font-size:.97rem;font-weight:700}
.cc-hd .ctag{font-size:.68rem;opacity:.6}
.wrow{display:grid;grid-template-columns:repeat(7,1fr);background:#f7fafc;border-bottom:1px solid #e2e8f0}
.wd{text-align:center;padding:7px 2px;font-size:.7rem;font-weight:700;color:#718096}
.wd.s{color:#e53e3e}.wd.sa{color:#3182ce}
.cbody{display:grid;grid-template-columns:repeat(7,1fr)}
.day{min-height:72px;padding:4px 3px;border-right:1px solid #f0f0f0;border-bottom:1px solid #f0f0f0}
.day:nth-child(7n){border-right:none}
.day.emp{background:#fafafa}
.day.hol{background:#fff5f5}
.day.obn{background:#fffbf0}
.day.sun .dn{color:#e53e3e}
.day.sat .dn{color:#3182ce}
.dn{font-size:.72rem;font-weight:600;color:#4a5568;margin-bottom:2px}
.hn{font-size:.52rem;color:#e53e3e;display:block;font-weight:500;line-height:1.2}
.on{font-size:.52rem;color:#d69e2e;display:block;font-weight:500}
.chips{display:flex;flex-direction:column;gap:2px}
.chip{border-radius:4px;padding:2px 5px;font-size:.62rem;font-weight:700;line-height:1.35;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .15s,transform .1s}
.chip:hover{opacity:.78;transform:scale(1.03)}

/* Modal */
.mwrap{display:none;position:fixed;inset:0;background:rgba(0,0,0,.52);z-index:300;align-items:center;justify-content:center;padding:16px}
.mwrap.open{display:flex}
.mbox{background:#fff;border-radius:16px;max-width:480px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 24px 64px rgba(0,0,0,.28)}
.mhd{padding:20px 22px 14px;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.mbadge{display:inline-block;border-radius:14px;padding:3px 10px;font-size:.7rem;font-weight:700;margin-bottom:6px}
.mttl{font-size:1.1rem;font-weight:800}
.mx{background:#f7fafc;border:none;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1rem;cursor:pointer;color:#718096;flex-shrink:0}
.mx:hover{background:#e2e8f0}
.mbd{padding:16px 22px 24px}
.mmeta{display:flex;gap:18px;flex-wrap:wrap;font-size:.8rem;color:#4a5568;margin-bottom:12px}
.mgnr{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#a0aec0;margin-bottom:12px}
.mlist{list-style:none;display:flex;flex-direction:column;gap:8px}
.mlist li{font-size:.86rem;line-height:1.55;padding-left:14px;position:relative}
.mlist li::before{content:'▶';position:absolute;left:0;top:5px;font-size:.5rem;color:#cbd5e0}
.snote{margin-top:14px;background:#EBF8FF;border-radius:8px;padding:9px 12px;font-size:.76rem;color:#2B6CB0;line-height:1.6}
</style>
</head>

      2:{title:'②情報収集・整理', chip:'②情報整理',genre:'業務情報の整理',    shared:true,topics:['業務に必要な情報をAIで集める方法','収集した情報を要点・課題・打ち手に整理する方法','目的に合わせた文章・メール・案内文の作成','AIで整理した情報をチームで活用するテンプレート作成']},

const HOLI={'2025-07-21':'海の日','2025-08-11':'山の日'};
const OBON=new Set(['2025-08-13','2025-08-14','2025-08-15']);
const WD=['日','月','火','水','木','金','土'];
const MONTHS=[{y:2025,m:7},{y:2025,m:8}];

let curP='ai', curS=null;

function init(){rTabs();rCards();rCals()}

function rTabs(){
  document.getElementById('tabs').innerHTML=
    Object.entries(P).map(([k,v])=>
      `<button class="tab ${k===curP?'on':''}" onclick="sw('${k}')">${v.short}</button>`
    ).join('');
}

function sw(k){curP=k;curS=null;rTabs();rCards();rCals()}

function rCards(){
  const p=P[curP];
  document.getElementById('scGrid').innerHTML=
    Object.entries(p.sess).map(([n,s])=>{
      const ni=+n,c=C[ni],on=curS===ni;
      return `<div class="sc ${on?'on':''}" style="--cd:${c.d};${on?`border-color:${c.d}`:''}" onclick="togS(${ni})">
        <div class="sc-n" style="background:${c.l};color:${c.t}">${ni}</div>
        <div class="sc-info">
          <div class="stl" style="color:${c.t}">${s.title}</div>
          <div class="sgn">${s.genre}</div>
          ${s.shared?'<span class="sh-tag">★ 営業・BO共通</span>':''}
        </div>
      </div>`;
    }).join('');
}

function togS(n){curS=curS===n?null:n;rCards();rCals()}

function rCals(){
  const p=P[curP];
  const em={};
  for(const ev of p.evs){
    if(curS!==null&&ev.s!==curS)continue;
    (em[ev.d]=em[ev.d]||[]).push(ev);
  }
  document.getElementById('calGrid').innerHTML=
    MONTHS.map(({y,m})=>mkMonth(y,m,em,p)).join('');
}

function mkMonth(y,m,em,p){
  const fd=new Date(y,m-1,1).getDay();
  const days=new Date(y,m,0).getDate();
  const pad=v=>String(v).padStart(2,'0');
  const ds=d=>`${y}-${pad(m)}-${pad(d)}`;

  let cells='';
  for(let i=0;i<fd;i++)cells+='<div class="day emp"></div>';
  for(let d=1;d<=days;d++){
    const str=ds(d),dow=new Date(y,m-1,d).getDay();
    const isH=!!HOLI[str],isO=OBON.has(str);
    const evs=em[str]||[];
    let cls='day';
    if(isH)cls+=' hol';else if(isO)cls+=' obn';
    if(dow===0)cls+=' sun';else if(dow===6)cls+=' sat';
    const note=isH?`<span class="hn">${HOLI[str]}</span>`:isO?`<span class="on">お盆</span>`:'';
    const chips=evs.map(ev=>{
      const c=C[ev.s],up=ev.t.startsWith('11');
      return `<div class="chip" style="background:${up?c.l:c.d};color:${up?c.t:'#fff'}"
        onclick="openM('${curP}',${ev.s},'${str}','${ev.t}')">${p.sess[ev.s].chip}</div>`;
    }).join('');
    cells+=`<div class="${cls}"><div class="dn">${d}${note}</div><div class="chips">${chips}</div></div>`;
  }
  const rem=(fd+days)%7;
  if(rem)for(let i=0;i<7-rem;i++)cells+='<div class="day emp"></div>';

  return `<div class="cc">
    <div class="cc-hd"><h3>${y}年${m}月</h3><span class="ctag">上旬5・下旬5</span></div>
    <div class="wrow">${WD.map((w,i)=>`<div class="wd ${i===0?'s':i===6?'sa':''}">${w}</div>`).join('')}</div>
    <div class="cbody">${cells}</div>
  </div>`;
}

function openM(pk,sn,ds,tm){
  const p=P[pk],s=p.sess[sn],c=C[sn];
  const [,mo,d]=ds.split('-'),dow=WD[new Date(ds).getDay()];
  const b=document.getElementById('mbadge');
  b.textContent=p.name;b.style.cssText=`background:${c.l};color:${c.t}`;
  document.getElementById('mttl').textContent=s.title;
  document.getElementById('mdate').textContent=`${+mo}月${+d}日（${dow}）`;
  document.getElementById('mtime').textContent=tm;
  document.getElementById('mgnr').textContent=s.genre;
  document.getElementById('mlist').innerHTML=s.topics.map(t=>`<li>${t}</li>`).join('');
  document.getElementById('snote').style.display=s.shared?'block':'none';
  document.getElementById('mwrap').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeM(){document.getElementById('mwrap').classList.remove('open');document.body.style.overflow='';}
function bgClick(e){if(e.target===document.getElementById('mwrap'))closeM();}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM();});
init();
</script>
</body>
