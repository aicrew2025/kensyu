<header><h1>aicrew 生成AI研修｜受講者登録</h1><p>①〜⑤の受講日をそれぞれ選んでください（順不同・全日程を2ヶ月以内に受講いただきます）</p></header>
<div id="app">
<div class="policy">📌 <b>受講日の変更について</b>：変更は<b style="color:#c0392b">受講日の10日前まで</b>であれば可能です。以降は変更不可。変更の際は研修サポート事務局 <b>support@aicrew.jp</b> へご連絡ください。</div>
<div class="step">STEP 1 ／ <b>コースを選ぶ</b></div>
<div class="courses" id="courses"></div>
<div id="selWrap" class="hide">
<div class="resetbar"><button id="resetBtn" class="reset" type="button">↺ 最初からやり直す</button></div>
<div class="step">STEP 2 ／ <b>①〜⑤の受講日を1つずつ選ぶ（順番は自由）</b></div>

<div id="sessions"></div>
<div id="calview" class="hide"></div>
<div class="step">STEP 3 ／ <b>受講者情報</b></div>
<div class="form">
<div class="fr"><label>会社名<span class="req">必須</span></label><input id="f_comp" placeholder="株式会社◯◯"></div>
<div class="fr"><label>受講者氏名<span class="req">必須</span></label><div class="namerow"><input id="f_sei" placeholder="姓（山田）"><input id="f_mei" placeholder="名（太郎）"></div></div>
<div class="fr"><label>ふりがな<span class="req">必須</span></label><div class="namerow"><input id="f_seik" placeholder="せい（やまだ）"><input id="f_meik" placeholder="めい（たろう）"></div></div>
<div class="fr"><label>メールアドレス<span class="req">必須</span></label><input id="f_mail" type="email" inputmode="email" placeholder="taro@example.co.jp"><div class="hint">日程・Zoom URLはこのアドレスに送ります（半角英数のみ・スペース不可）</div><div id="mailErr" class="hint" style="color:#c0392b;display:none">メールアドレスの形式を確認してください</div></div>

</div>
</div></div>
<div id="result" class="hide"></div>
</div>

<button id="totop" type="button">↑ TOPに戻る</button>
<div id="tray" class="hide"><div class="tray-in">
<div class="tray-h"><span>📋 受講予定（自動反映）</span><span id="status" class="status wait">コースを選択</span></div>
<div class="slots" id="slots"></div>
<div class="totline"><span id="spaninfo"></span><span id="tot"></span></div>
<div id="errmsg" class="errmsg hide"></div>
<button class="sub" id="submit" style="margin-top:8px;padding:11px" disabled>この内容で申込む</button>
</div></div>

function calMonthsFor(course){
  const opt=D.opt[course],map={},ms=new Set();
  for(let n=1;n<=5;n++)opt[n].forEach(o=>{(map[o.date]=map[o.date]||[]).push({n:n,time:o.time});ms.add(o.date.slice(0,7));});
  return {map:map,months:[...ms].sort()};
}
function renderCalendar(){
  if(!st.course){$('calview').innerHTML='';return;}
  const th=D.theme[st.course],r=calMonthsFor(st.course),WD=['日','月','火','水','木','金','土'];
  let h='<div class="cal-legend">'+[1,2,3,4,5].map(n=>`<span class="cal-leg"><span class="b s${n}">${CIR[n-1]}</span>${th[n]}</span>`).join('')+'</div>';
  h+='<div class="cal-note">※ 日程の選択は「リストで選ぶ」タブから行ってください（選んだ回は枠で表示されます）</div>';
  for(const ym of r.months){
    const y=+ym.slice(0,4),m=+ym.slice(5,7);
    const first=new Date(Date.UTC(y,m-1,1)).getUTCDay(),days=new Date(Date.UTC(y,m,0)).getUTCDate();
    h+=`<div class="cal-month"><div class="cal-mh">${y}年 ${m}月</div><div class="cal-grid">`;
    h+=WD.map((w,i)=>`<div class="cal-wd${i===0?' sun':i===6?' sat':''}">${w}</div>`).join('');
    for(let i=0;i<first;i++)h+='<div class="cal-cell empty"></div>';
    for(let d=1;d<=days;d++){
      const ds=ym+'-'+String(d).padStart(2,'0'),evs=r.map[ds];
      let inner=`<div class="cal-d">${d}</div>`;
      if(evs)inner+=evs.map(e=>`<div class="cal-ev${st.sel[e.n]===ds?' sel':''}"><span class="b s${e.n}">${CIR[e.n-1]}</span><span class="cal-t">${e.time.split('〜')[0]}</span></div>`).join('');
      h+=`<div class="cal-cell${evs?' has':''}">${inner}</div>`;
    }
    h+='</div></div>';
  }
  $('calview').innerHTML=h;
}
function resetAll(){
  st.course=null;st.sel={1:null,2:null,3:null,4:null,5:null};
  document.querySelectorAll('.cbtn').forEach(x=>x.classList.remove('on'));
  $('selWrap').classList.add('hide');$('tray').classList.add('hide');$('result').classList.add('hide');$('app').classList.remove('hide');
  window.scrollTo({top:0,behavior:'smooth'});
}
function setView(v){
  document.querySelectorAll('.viewtabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  $('sessions').classList.toggle('hide',v!=='list');
  $('calview').classList.toggle('hide',v!=='cal');
  if(v==='cal')renderCalendar();
}
function update(){
  const opt=st.course?D.opt[st.course]:null;
  // slots
  let slots='';
  for(let n=1;n<=5;n++){
    const d=st.sel[n];
    if(d){const o=opt[n].find(x=>x.date===d);slots+=`<div class="slot"><span class="n b s${n}" style="margin:0 auto;display:inline-flex">${CIR[n-1]}</span><div class="d">${md(d)}</div><div class="tm">${o.time.split('〜')[0]}〜</div></div>`;}
    else slots+=`<div class="slot"><span class="b s${n}" style="margin:0 auto;display:inline-flex;opacity:.5">${CIR[n-1]}</span><div class="d e">—</div></div>`;
  }
  $('slots').innerHTML=slots;
  const picked=Object.values(st.sel).filter(Boolean);
  const all=picked.length===5;
  let okSpan=false;
  if(all){
    const ds=[st.sel[1],st.sel[2],st.sel[3],st.sel[4],st.sel[5]].map(s=>new Date(s));
    const first=new Date(Math.min(...ds)),last=new Date(Math.max(...ds));
    okSpan=last<=addMonths(first,2);
    $('spaninfo').textContent=md(first.toISOString().slice(0,10))+' 〜 '+md(last.toISOString().slice(0,10));
    $('tot').textContent='全5回／計10.0時間';
  }else{$('spaninfo').textContent='';$('tot').textContent=picked.length+'/5 選択';}
  const st_el=$('status');
  if(!all){st_el.className='status wait';st_el.textContent=picked.length+'/5 選択中';}
  else if(!okSpan){st_el.className='status ng';st_el.textContent='⚠ 2ヶ月を超えています';}
  else{st_el.className='status ok';st_el.textContent='✓ 2ヶ月以内 OK';}
  const em=$('errmsg');
  if(all&&!okSpan){em.className='errmsg';em.textContent='⚠ 全日程を2ヶ月以内に収めてください（最も早い回から2ヶ月以内）。送信できません。';}
  else{em.className='errmsg hide';}
  const mailVal=$('f_mail').value;const mailOk=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mailVal);$('mailErr').style.display=(mailVal&&!mailOk)?'block':'none';
  const form=$('f_comp').value.trim()&&$('f_sei').value.trim()&&$('f_mei').value.trim()&&$('f_seik').value.trim()&&$('f_meik').value.trim()&&mailOk;
  $('submit').disabled=!(all&&okSpan&&form);
}
['f_comp','f_sei','f_mei','f_seik','f_meik','f_mail'].forEach(id=>$(id).addEventListener('input',update));
$('f_mail').addEventListener('input',function(){var v=this.value.replace(/[^\x21-\x7e]/g,'');if(v!==this.value)this.value=v;update();});
function buildRows_(){
  const opt=D.opt[st.course],th=D.theme[st.course];
  var rows='';for(let n=1;n<=5;n++){const o=opt[n].find(x=>x.date===st.sel[n]);rows+=`<tr><td><b>${CIR[n-1]}</b> ${th[n]}</td><td>${md(o.date)}</td><td>${o.time}</td><td>${ddl(o.date)}まで</td></tr>`;}
  const labels=[1,2,3,4,5].map(n=>{const o=opt[n].find(x=>x.date===st.sel[n]);return md(o.date)+'('+o.wd+') '+o.time+' '+th[n];});
  const ddls=[1,2,3,4,5].map(n=>ddl(st.sel[n]));
  const sess=[1,2,3,4,5].map(n=>{const o=opt[n].find(x=>x.date===st.sel[n]);return {n:n,date:o.date,wd:o.wd,time:o.time,theme:th[n],deadline:ddl(o.date)};});
  return {rows:rows,labels:labels,ddls:ddls,sessions:sess};
}
function infoLine_(){ return `${$('f_comp').value}／<b>${fullName()}</b> 様<br>${CN[st.course]}（全5回・計10.0時間／2ヶ月以内）`; }

$('submit').onclick=()=>{
  const r=buildRows_();
  $('result').innerHTML=`<div class="done" style="background:#eef0ff;border-color:#cdd3ff">
   <h2 style="color:#3c3489">この内容でよろしいですか？</h2>
   <div style="font-size:12.5px">${infoLine_()}</div>
   <table><tr><td>研修内容</td><td>日付</td><td>時間</td><td>変更締切</td></tr>${r.rows}</table>
   <div style="font-size:12px">各回のZoom URLは <b>${$('f_mail').value}</b> 宛にお送りします。</div>
   <div style="font-size:11.5px;margin-top:8px;background:#fff8e6;border:1px solid #f0d98a;border-radius:8px;padding:9px 11px;color:#7a5c00">⚠ まだ送信されていません。内容をご確認のうえ、下の「確定して申込む」を押してください。</div>
   <div style="display:flex;gap:8px;margin-top:12px">
     <button class="sub" style="background:#9a9aa3;flex:1" onclick="backToForm()">← 修正する</button>
     <button class="sub" id="confirmBtn" style="flex:2" onclick="doSubmit()">確定して申込む</button>
   </div></div>`;
  $('app').classList.add('hide');$('tray').classList.add('hide');$('result').classList.remove('hide');window.scrollTo({top:0,behavior:'smooth'});
};

window.backToForm=function(){ $('result').classList.add('hide');$('app').classList.remove('hide');$('tray').classList.remove('hide');window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'}); };

window.doSubmit=async function(){
  var btn=$('confirmBtn'); if(btn&&btn.dataset.busy)return; if(btn){btn.dataset.busy='1';btn.disabled=true;btn.textContent='送信中…';}
  const r=buildRows_();
  try{
    const res=await fetch(SB_FN,{method:'POST',headers:{'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY},body:JSON.stringify({company:$('f_comp').value,name:fullName(),kana:fullKana(),email:$('f_mail').value,course:st.course,course_label:CN[st.course],sessions:r.sessions})});
    const data=await res.json().catch(()=>({}));
    if(!res.ok||!data.ok){throw new Error(data.error||('HTTP '+res.status));}
  }catch(e){
    if(btn){btn.dataset.busy='';btn.disabled=false;btn.textContent='確定して申込む';}
    var box=document.querySelector('#result .done');
    if(box){var old=box.querySelector('.errmsg');if(old)old.remove();var eb=document.createElement('div');eb.className='errmsg';eb.style.marginTop='12px';eb.textContent='⚠ 送信に失敗しました。通信環境をご確認のうえ、もう一度お試しください。（'+(e&&e.message?e.message:'error')+'）';box.appendChild(eb);}
    else{alert('送信に失敗しました。もう一度お試しください。');}
    return;
  }
  $('result').innerHTML=`<div class="done"><h2>✓ お申込みを受け付けました</h2>
   <div style="font-size:12.5px">${infoLine_()}</div>
   <table><tr><td>研修内容</td><td>日付</td><td>時間</td><td>変更締切</td></tr>${r.rows}</table>
   <div style="font-size:12px">各回のZoom URLは <b>${$('f_mail').value}</b> 宛にお送りします。</div>
   <div style="font-size:11.5px;margin-top:8px;background:#fff8e6;border:1px solid #f0d98a;border-radius:8px;padding:9px 11px;color:#7a5c00">📌 受講日の変更は<b style="color:#c0392b">受講日の10日前まで</b>であれば可能です。以降は変更不可。各回の<b>変更締切</b>までに <b>support@aicrew.jp</b>（研修サポート事務局）へご連絡ください。</div>
   <button class="sub" style="margin-top:12px;background:#534ab7" onclick="window.print()">この画面を保存する（PDF）</button><button class="sub" style="margin-top:8px;background:#1a1a1a" onclick="location.reload()">別の受講者を登録する</button></div>`;
  window.scrollTo({top:0,behavior:'smooth'});
};

renderCourses();
document.querySelectorAll('.viewtabs button').forEach(b=>b.onclick=()=>setView(b.dataset.v));
$('resetBtn').onclick=resetAll;
$('totop').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
window.addEventListener('scroll',()=>$('totop').classList.toggle('show',window.scrollY>300));
</script></body></html>
